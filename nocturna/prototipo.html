
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rueda Nocturna</title>

    <!-- Conectar Tailwind CSS -->
  <link rel="stylesheet" href="./src/output.css">

</head>

<body class="bg-gray-900 text-white">

    <!-- CONTENIDO PRINCIPAL -->
    <main class="min-h-screen flex justify-center items-center p-6">

        <!-- SECCION PRINCIPAL -->
        <section class="text-center">

            <!-- ETIQUETA DE CAMPAÑA -->
            <p class="text-green-400 font-bold uppercase">
                Nuevo - Jueves a sábado
            </p>

            <!-- TITULO PRINCIPAL -->
            <h1 class="text-5xl font-bold mt-4">
                Rueda Nocturna
            </h1>

            <!-- SUBTITULO -->
            <p class="text-gray-300 text-xl mt-4">
                En Medellín, la ciudad se enciende en luces.
            </p>

            <!-- DATOS DESTACADOS -->
            <div class="flex justify-center gap-10 mt-8">

                <!-- PRIMER DATO -->
                <div>
                    <h2 class="text-3xl font-bold text-green-400">
                        3
                    </h2>

                    <p class="text-gray-300">
                        Rutas
                    </p>
                </div>

                <!-- SEGUNDO DATO -->
                <div>
                    <h2 class="text-3xl font-bold text-green-400">
                        $55.000
                    </h2>

                    <p class="text-gray-300">
                        Desde
                    </p>
                </div>
             <div class="flex flex-col gap-4 p-8 items-start">
    
             <!-- 1. Botón Principal (Primary) -->
                   <button class="bg-blue-600 text-white font-semibold px-6 py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors">
                  Botón Principal
                  </button>

             <!-- 2. Botón Secundario (Secondary) -->
                  <button class="bg-gray-200 text-gray-800 font-semibold px-6 py-2 rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-4 focus:ring-gray-400 transition-colors">
                   Botón Secundario
                 </button>

             <!-- 3. Botón de Contorno (Outline) -->
                  <button class="border-2 border-blue-600 text-blue-600 font-semibold px-6 py-2 rounded-lg hover:bg-blue-50 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-colors">
                  Botón de Contorno
                 </button>

            </div>

            </div>

            <!-- BOTON DE INSCRIPCION -->
            <a href="#reservas"
               class="inline-block bg-green-500 text-white font-bold px-8 py-4 rounded-lg mt-8">

                Inscríbete

            </a>

        </section>

    </main>

</body>
</html>
